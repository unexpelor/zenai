<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1550" viewBox="0 0 1200 1550">
<rect width="1200" height="1550" fill="#0b1020"/>
<style>text{font-family:Arial,sans-serif;fill:#f8fafc}.title{font-size:34px;font-weight:700}.label{font-size:20px;font-weight:700}.small{font-size:16px;fill:#cbd5e1}.box{fill:#111827;stroke:#475569;stroke-width:2}.accent{fill:#13243a;stroke:#38bdf8}.green{fill:#10251c;stroke:#4ade80}.arrow{stroke:#94a3b8;stroke-width:3;fill:none;marker-end:url(#a)}</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<text x="600" y="55" text-anchor="middle" class="title">ZENAI — Application Flowchart</text>
<text x="600" y="85" text-anchor="middle" class="small">From business context to action, monitoring and evaluation</text>
<rect x="400" y="120" width="400" height="70" rx="16" class="box"/><text x="600" y="163" text-anchor="middle" class="label">User / Young Entrepreneur</text>
<path d="M600 190 V225" class="arrow"/>
<rect x="400" y="225" width="400" height="70" rx="16" class="accent"/><text x="600" y="268" text-anchor="middle" class="label">Login + Tell Your Business</text>
<path d="M600 295 V330" class="arrow"/>
<rect x="400" y="330" width="400" height="70" rx="16" class="box"/><text x="600" y="373" text-anchor="middle" class="label">Business Pulse</text>
<path d="M600 400 V435" class="arrow"/>
<rect x="400" y="435" width="400" height="70" rx="16" class="box"/><text x="600" y="478" text-anchor="middle" class="label">Diagnosis</text>
<path d="M600 505 V540" class="arrow"/>
<rect x="400" y="540" width="400" height="70" rx="16" class="box"/><text x="600" y="583" text-anchor="middle" class="label">Market Insight</text>
<path d="M800 575 H930" class="arrow"/><rect x="930" y="540" width="210" height="70" rx="16" class="green"/><text x="1035" y="583" text-anchor="middle" class="label">Tavily Sources</text>
<path d="M600 610 V645" class="arrow"/>
<rect x="400" y="645" width="400" height="80" rx="16" class="accent"/><text x="600" y="680" text-anchor="middle" class="label">Business Autopilot</text><text x="600" y="705" text-anchor="middle" class="small">7 / 14 / 30 day action plan</text>
<path d="M600 725 V760" class="arrow"/>
<rect x="400" y="760" width="400" height="70" rx="16" class="box"/><text x="600" y="803" text-anchor="middle" class="label">Business Growth Loop</text>
<path d="M600 830 V865" class="arrow"/>
<rect x="400" y="865" width="400" height="70" rx="16" class="box"/><text x="600" y="908" text-anchor="middle" class="label">Business Updates</text>
<path d="M600 935 V970" class="arrow"/>
<rect x="400" y="970" width="400" height="70" rx="16" class="box"/><text x="600" y="1013" text-anchor="middle" class="label">Financial Records</text>
<path d="M600 1040 V1075" class="arrow"/>
<rect x="400" y="1075" width="400" height="70" rx="16" class="box"/><text x="600" y="1118" text-anchor="middle" class="label">Evaluation</text>
<path d="M400 1110 H240 V365 H400" class="arrow"/><text x="170" y="735" text-anchor="middle" transform="rotate(-90 170 735)" class="small">New updates feed the next analysis cycle</text>
<rect x="70" y="1190" width="1060" height="270" rx="20" class="box"/>
<text x="100" y="1230" class="label">AI + Data Processing</text>
<text x="100" y="1270" class="small">Text AI: Groq → OpenRouter → Gemini</text>
<text x="100" y="1305" class="small">Image / Audio: Gemini</text>
<text x="100" y="1340" class="small">Market evidence: Tavily → AI analysis</text>
<text x="100" y="1375" class="small">Persistence: Supabase Auth + RLS + JSONB user state</text>
<text x="100" y="1410" class="small">Presentation localization: ID / EN with persistent user preference</text>
</svg>
